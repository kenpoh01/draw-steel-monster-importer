<div class="window-content">
  <form class="monster-importer flexcol">
    <h2>Import Draw Steel Monster</h2>
    <p><p>Paste the raw monster text below. Optionally include malice abilities.</p></p>

    <!-- Folder -->
    <div class="form-group">
      <label for="monster-folder">Folder Name</label>
      <input type="text" id="monster-folder" name="monster-folder" placeholder="Optional: Create or use folder" />
    </div>

    <!-- Raw text input -->
    <div class="form-group" id="text-block">
      <label for="monster-text">Raw Text</label>
      <textarea id="monster-text" rows="12" placeholder="Paste monster blocks here, copied directly from the PDF. Works with official or pre-release stat block layouts — no special separators needed.  PLEASE NOTE: if multiple monsters are pasted, check that there isn't a random letter 'i' between monster headers and delete them if there are."></textarea>
    </div>

<!-- Optional Malice Block -->
<div class="form-group" id="malice-block">
  <label for="malice-text">Malice Abilities (optional)</label>
  <textarea id="malice-text" rows="10" placeholder="Paste malice abilities here, no need to paste the malice description. Note, each monster pasted above will receive the same malice abilities. Leave blank for minions."></textarea>
</div>


    <button type="button" class="import-button" id="import-button">
      <i class="fas fa-plus"></i> Import Monster
    </button>
  </form>
</div>
